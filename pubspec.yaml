name: qoot
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_localization: ^0.3.3
  flutter_native_splash: ^2.4.6
  flutter_bloc: ^9.1.1
  device_preview: ^1.3.1
  animate_do: ^4.2.0
  lottie: ^3.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#FAFAFA"
  image: assets/master/light_splash_screen.png
  color_dark: "#077734"
  image_dark: assets/master/dark_splash_screen.png
  android_12:
    image: assets/master/light_splash_screen.png
    color: "#FAFAFA"
    image_dark: assets/master/dark_splash_screen.png
    color_dark: "#077734"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/master/
    - assets/fonts/
    - assets/fonts/cairo/
    - assets/animations/
    - assets/placeholder/

  fonts:
    - family: "Cairo"
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
